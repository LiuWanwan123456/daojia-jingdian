<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>道家经典 · 八大神咒 · 黄庭 · 五斗 · 清静</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Serif SC", serif;
            background: #f5efe8;
            color: #3e2e1f;
            min-height: 100vh;
            padding: 16px 12px 40px;
        }
        .app-container {
            max-width: 640px;
            margin: 0 auto;
            background: rgba(255, 252, 245, 0.92);
            backdrop-filter: blur(2px);
            border-radius: 32px 32px 24px 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.07), 0 0 0 1px rgba(200, 175, 150, 0.2);
            padding: 20px 18px 32px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e2d5c8;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 500;
            letter-spacing: 3px;
            color: #4a3724;
            background: linear-gradient(135deg, #5a3f2b, #3e2a1b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .back-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #6b4f38;
            padding: 0 8px;
            transition: 0.2s;
            display: none;
        }
        .back-btn.visible {
            display: block;
        }
        .back-btn:hover {
            transform: scale(1.1);
        }

        /* ===== 朗读控制栏 ===== */
        .tts-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: #f5ede4;
            border-radius: 40px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            border: 1px solid #e2d5c8;
        }
        .tts-bar .tts-btn {
            background: #4a3724;
            color: #fff;
            border: none;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .tts-bar .tts-btn:active {
            transform: scale(0.95);
        }
        .tts-bar .tts-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .tts-bar .tts-btn.secondary {
            background: #b8a68b;
            color: #2d1f14;
        }
        .tts-bar .tts-status {
            font-size: 14px;
            color: #6b5a4a;
            margin-left: 4px;
            flex: 1;
            min-width: 60px;
        }
        .tts-bar .tts-voice-select {
            padding: 4px 8px;
            border-radius: 20px;
            border: 1px solid #dacfc4;
            background: #fffcf5;
            font-size: 13px;
            font-family: inherit;
            color: #3e2e1f;
            max-width: 140px;
        }

        .view {
            display: block;
        }
        .view.hidden {
            display: none;
        }

        /* ===== 首页目录 ===== */
        .catalog-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 4px;
        }
        .catalog-card {
            background: #fcf8f2;
            border-radius: 20px;
            padding: 18px 18px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #e6dad0;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }
        .catalog-card:active {
            transform: scale(0.97);
            background: #f5ede4;
        }
        .catalog-card .tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 500;
            background: #dacfc4;
            color: #3e2e1f;
            padding: 2px 14px;
            border-radius: 40px;
            letter-spacing: 1.5px;
            margin-bottom: 4px;
        }
        .catalog-card h2 {
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 2px;
            color: #2d1f14;
        }
        .catalog-card p {
            font-size: 13px;
            color: #6b5a4a;
            line-height: 1.4;
        }
        .catalog-card .arrow {
            position: absolute;
            right: 18px;
            bottom: 14px;
            font-size: 22px;
            color: #b8a18c;
            opacity: 0.5;
        }
        .card-quanzhen .tag {
            background: #c7b7a3;
        }
        .card-zhengyi .tag {
            background: #b8a68b;
        }
        .card-huangting .tag {
            background: #c9b9a2;
        }
        .card-wudou .tag {
            background: #b5aa95;
        }
        .card-qingjing .tag {
            background: #d5c8ba;
        }

        /* ===== 二级列表 ===== */
        .sub-title {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 2px;
            color: #3e2a1b;
        }
        .sub-desc {
            font-size: 13px;
            color: #7a6856;
            margin-bottom: 12px;
            border-left: 3px solid #dacfc4;
            padding-left: 14px;
        }
        .spell-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .spell-item {
            background: #fcf8f2;
            border-radius: 18px;
            padding: 16px 16px 12px;
            border: 1px solid #ebe0d5;
        }
        .spell-name {
            font-size: 19px;
            font-weight: 550;
            color: #3e2a1b;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .spell-name .badge {
            font-size: 11px;
            font-weight: 400;
            background: #ded3c8;
            color: #3e2a1b;
            padding: 0 12px;
            border-radius: 30px;
            letter-spacing: 0.5px;
        }
        .spell-name .badge.long {
            background: #c9b9a8;
        }
        .spell-name .badge.short {
            background: #dacfc4;
        }
        .spell-body {
            margin-top: 8px;
        }
        .verse-line {
            font-size: 18px;
            line-height: 2.0;
            letter-spacing: 0.04em;
            font-weight: 450;
            color: #2c1f14;
            padding: 1px 0;
            font-family: "Noto Serif SC", "华文楷体", "KaiTi", "STKaiti", "楷体", serif;
        }
        .spell-divider {
            margin: 10px 0 6px;
            border: 0;
            height: 1px;
            background: linear-gradient(to right, #e6dacd, transparent);
        }

        /* ===== 通用章节样式 ===== */
        .chapter-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 8px;
            margin-bottom: 18px;
            padding: 12px 10px;
            background: #f5ede4;
            border-radius: 16px;
            max-height: 200px;
            overflow-y: auto;
        }
        .chapter-nav a {
            font-size: 13px;
            color: #4a3724;
            text-decoration: none;
            background: #fffcf5;
            padding: 2px 12px;
            border-radius: 30px;
            border: 1px solid #dacfc4;
            transition: 0.15s;
            font-family: inherit;
        }
        .chapter-nav a:active {
            background: #dacfc4;
        }
        .chapter-block {
            margin-bottom: 24px;
        }
        .chapter-title {
            font-size: 18px;
            font-weight: 550;
            color: #3e2a1b;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px dashed #ddd0c4;
        }
        .chapter-body .verse-line {
            font-size: 17px;
            line-height: 2.1;
        }
        .chapter-body .verse-line:first-child {
            margin-top: 4px;
        }

        /* ===== 清静经 ===== */
        .qingjing-body .verse-line {
            font-size: 18px;
            line-height: 2.2;
            text-align: left;
        }

        .footer-note {
            margin-top: 28px;
            text-align: center;
            font-size: 12px;
            color: #b3a08e;
            letter-spacing: 1px;
            border-top: 1px solid #ece1d7;
            padding-top: 16px;
        }
        .fade-in {
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(6px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @media (max-width: 480px) {
            .app-container {
                padding: 14px 10px 24px;
            }
            .header h1 {
                font-size: 19px;
                letter-spacing: 2px;
            }
            .verse-line {
                font-size: 16px;
                line-height: 1.9;
            }
            .catalog-card h2 {
                font-size: 20px;
            }
            .chapter-body .verse-line {
                font-size: 15px;
            }
            .chapter-nav a {
                font-size: 12px;
                padding: 1px 10px;
            }
            .qingjing-body .verse-line {
                font-size: 16px;
            }
            .tts-bar .tts-btn {
                font-size: 13px;
                padding: 5px 14px;
            }
            .tts-bar .tts-voice-select {
                max-width: 100px;
                font-size: 12px;
            }
        }
    </style>
</head>

                const items = listView.querySelectorAll('.spell-item');
                items.forEach(item => {
                    const name = item.querySelector('.spell-name')?.textContent || '';
                    const lines = item.querySelectorAll('.verse-line');
                    let content = '';
                    lines.forEach(el => { content += el.textContent + ' '; });
                    if (content.trim()) text += name + '。' + content + '\n';
                });
            } else if (!chapterView.classList.contains('hidden')) {
                // 黄庭经 / 五斗经
                const blocks = chapterView.querySelectorAll('.chapter-block');
                blocks.forEach(block => {
                    const title = block.querySelector('.chapter-title')?.textContent || '';
                    const lines = block.querySelectorAll('.verse-line');
                    let content = '';
                    lines.forEach(el => { content += el.textContent + ' '; });
                    if (content.trim()) text += title + '。' + content + '\n';
                });
            } else if (!qingjingView.classList.contains('hidden')) {
                // 清静经
                const lines = qingjingView.querySelectorAll('.verse-line');
                lines.forEach(el => { text += el.textContent + ' '; });
            }
            return text.trim();
        }

        // 将长文本切分为适合朗读的片段（按句号、分号、逗号等分割）
        function splitTextIntoChunks(text) {
            // 按标点分割，保留标点
            const chunks = text.split(/(?<=[。；，、！？\n])/);
            return chunks.filter(c => c.trim().length > 0);
        }

        // 朗读下一段
        function speakNextChunk() {
            if (currentChunkIndex >= currentTextChunks.length) {
                // 全部读完
                isSpeaking = false;
                ttsStatus.textContent = '朗读完成';
                ttsPlayBtn.textContent = '▶ 朗读';
                ttsPlayBtn.disabled = false;
                ttsStopBtn.disabled = true;
                return;
            }

            const chunk = currentTextChunks[currentChunkIndex];
            const utterance = new SpeechSynthesisUtterance(chunk);
            utterance.lang = 'zh-CN';

            // 选择语音
            const selectedVoice = ttsVoiceSelect.value;
            if (selectedVoice) {
                const voices = speechSynth.getVoices();
                const voice = voices.find(v => v.name === selectedVoice);
                if (voice) utterance.voice = voice;
            }

            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;

            utterance.onstart = function() {
                isSpeaking = true;
                ttsStatus.textContent = `朗读中 ${currentChunkIndex + 1}/${currentTextChunks.length}`;
                ttsPlayBtn.textContent = '⏸ 暂停';
                ttsPlayBtn.disabled = false;
                ttsStopBtn.disabled = false;
            };

            utterance.onend = function() {
                currentChunkIndex++;
                if (currentChunkIndex < currentTextChunks.length) {
                    // 继续下一段
                    speakNextChunk();
                } else {
                    isSpeaking = false;
                    ttsStatus.textContent = '朗读完成';
                    ttsPlayBtn.textContent = '▶ 朗读';
                    ttsPlayBtn.disabled = false;
                    ttsStopBtn.disabled = true;
                }
            };

            utterance.onerror = function(e) {
                console.warn('语音合成错误:', e);
                if (e.error !== 'canceled' && e.error !== 'interrupted') {
                    isSpeaking = false;
                    ttsStatus.textContent = '朗读出错，请重试';
                    ttsPlayBtn.textContent = '▶ 朗读';
                    ttsPlayBtn.disabled = false;
                    ttsStopBtn.disabled = true;
                } else {
                    // 被取消或中断，不处理
                }
            };

            currentUtterance = utterance;
            speechSynth.speak(utterance);
        }

        // 开始朗读
        function startReading() {
            if (isSpeaking && !isPaused) {
                // 正在播放中，点击暂停
                pauseReading();
                return;
            }

            if (isPaused) {
                // 从暂停恢复
                resumeReading();
                return;
            }

            // 全新开始
            const fullText = getCurrentViewText();
            if (!fullText || fullText.trim().length === 0) {
                ttsStatus.textContent = '没有可朗读的经文';
                return;
            }

            // 取消之前的任何语音
            if (speechSynth.speaking) {
                speechSynth.cancel();
            }

            currentTextChunks = splitTextIntoChunks(fullText);
            currentChunkIndex = 0;
            isPaused = false;

            if (currentTextChunks.length === 0) {
                ttsStatus.textContent = '没有可朗读的经文';
                return;
            }

            ttsStatus.textContent = '准备朗读...';
            ttsPlayBtn.disabled = true;
            speakNextChunk();
        }

        // 暂停朗读
        function pauseReading() {
            if (isSpeaking && !isPaused) {
                isPaused = true;
                if (speechSynth.speaking) {
                    speechSynth.pause();
                }
                ttsStatus.textContent = '已暂停';
                ttsPlayBtn.textContent = '▶ 继续';
                ttsPlayBtn.disabled = false;
            }
        }

        // 恢复朗读
        function resumeReading() {
            if (isPaused) {
                isPaused = false;
                if (speechSynth.paused) {
                    speechSynth.resume();
                } else {
                    // 如果被意外取消，重新开始当前片段
                    speakNextChunk();
                }
                ttsStatus.textContent = `朗读中 ${currentChunkIndex + 1}/${currentTextChunks.length}`;
                ttsPlayBtn.textContent = '⏸ 暂停';
                ttsPlayBtn.disabled = false;
            }
        }

        // 停止朗读
        function stopReading() {
            if (speechSynth.speaking) {
                speechSynth.cancel();
            }
            isSpeaking = false;
            isPaused = false;
            currentChunkIndex = 0;
            currentTextChunks = [];
            currentUtterance = null;
            ttsStatus.textContent = '已停止';
            ttsPlayBtn.textContent = '▶ 朗读';
            ttsPlayBtn.disabled = false;
            ttsStopBtn.disabled = true;
        }

        // 初始化语音列表
        function populateVoiceList() {
            const voices = speechSynth.getVoices();
            const select = ttsVoiceSelect;
            // 保留默认选项
            select.innerHTML = '<option value="">默认语音</option>';
            // 优先中文语音
            const chineseVoices = voices.filter(v => v.lang.startsWith('zh'));
            const otherVoices = voices.filter(v => !v.lang.startsWith('zh'));
            const sorted = [...chineseVoices, ...otherVoices];
            sorted.forEach(voice => {
                const option = document.createElement('option');
                option.value = voice.name;
                option.textContent = `${voice.name} (${voice.lang})`;
                select.appendChild(option);
            });
        }

        // 语音列表变化时，如果正在朗读则重新开始
        ttsVoiceSelect.addEventListener('change', function() {
            if (isSpeaking || isPaused) {
                stopReading();
                // 稍微延迟后自动开始
                setTimeout(() => startReading(), 300);
            }
        });

        // 语音列表加载完成事件
        if (speechSynth.onvoiceschanged !== undefined) {
            speechSynth.onvoiceschanged = populateVoiceList;
        }
        // 立即尝试加载
        setTimeout(populateVoiceList, 100);

        // 按钮事件
        ttsPlayBtn.addEventListener('click', startReading);
        ttsStopBtn.addEventListener('click', stopReading);

        // 切换视图时自动停止朗读
        function autoStopOnViewChange() {
            if (isSpeaking || isPaused) {
                stopReading();
            }
        }

        // ================================================================
        //  导航控制
        // ================================================================

        let currentView = 'home';

        function showHome() {
            autoStopOnViewChange();
            homeView.classList.remove('hidden');
            listView.classList.add('hidden');
            chapterView.classList.add('hidden');
            qingjingView.classList.add('hidden');
            backBtn.classList.remove('visible');
            mainTitle.textContent = '☯ 道家经典';
            currentView = 'home';
        }

        function showSpellList(data, sectName, desc) {
            autoStopOnViewChange();
            listView.classList.remove('hidden');
            homeView.classList.add('hidden');
            chapterView.classList.add('hidden');
            qingjingView.classList.add('hidden');
            backBtn.classList.add('visible');
            mainTitle.textContent = '📖 八大神咒';
            currentView = 'spell';

            listTitle.textContent = sectName;
            listDesc.textContent = desc || '';

            spellListContainer.innerHTML = '';
            data.forEach(item => {
                const div = document.createElement('div');
                div.className = 'spell-item fade-in';
                const nameDiv = document.createElement('div');
                nameDiv.className = 'spell-name';
                const nameSpan = document.createElement('span');
                nameSpan.textContent = item.name;
                nameDiv.appendChild(nameSpan);
                if (item.badge) {
                    const badge = document.createElement('span');
                    badge.className = 'badge';
                    if (item.badge === '长版') badge.classList.add('long');
                    else if (item.badge === '短版') badge.classList.add('short');
                    badge.textContent = item.badge;
                    nameDiv.appendChild(badge);
                }
                div.appendChild(nameDiv);
                const bodyDiv = document.createElement('div');
                bodyDiv.className = 'spell-body';
                item.verses.forEach((verse) => {
                    const p = document.createElement('div');
                    p.className = 'verse-line';
                    p.textContent = verse.text;
                    bodyDiv.appendChild(p);
                });
                div.appendChild(bodyDiv);
                spellListContainer.appendChild(div);
            });
        }

        function showChapterView(data, title, desc, idPrefix) {
            autoStopOnViewChange();
            chapterView.classList.remove('hidden');
            homeView.classList.add('hidden');
            listView.classList.add('hidden');
            qingjingView.classList.add('hidden');
            backBtn.classList.add('visible');
            mainTitle.textContent = title;
            currentView = 'chapter';

            chapterViewTitle.textContent = title;
            chapterViewDesc.textContent = desc || '';

            chapterNav.innerHTML = '';
            data.forEach(ch => {
                const a = document.createElement('a');
                a.href = `#${idPrefix}-${ch.chapter}`;
                a.textContent = ch.chapter;
                chapterNav.appendChild(a);
            });

            chapterBody.innerHTML = '';
            data.forEach(ch => {
                const section = document.createElement('div');
                section.className = 'chapter-block';
                section.id = `${idPrefix}-${ch.chapter}`;

                const titleDiv = document.createElement('div');
                titleDiv.className = 'chapter-title';
                titleDiv.textContent = `${ch.chapter}. ${ch.title}`;
                section.appendChild(titleDiv);

                const bodyDiv = document.createElement('div');
                bodyDiv.className = 'chapter-body';
                ch.lines.forEach(line => {
                    const p = document.createElement('div');
                    p.className = 'verse-line';
                    p.textContent = line;
                    bodyDiv.appendChild(p);
                });
                section.appendChild(bodyDiv);
                chapterBody.appendChild(section);
            });
        }

        function showQingjing() {
            autoStopOnViewChange();
            qingjingView.classList.remove('hidden');
            homeView.classList.add('hidden');
            listView.classList.add('hidden');
            chapterView.classList.add('hidden');
            backBtn.classList.add('visible');
            mainTitle.textContent = '🌿 清静经';
            currentView = 'qingjing';

            qingjingBody.innerHTML = '';
            qingjingLines.forEach(line => {
                const p = document.createElement('div');
                p.className = 'verse-line';
                p.textContent = line;
                qingjingBody.appendChild(p);
            });
        }

        // ================================================================
        //  事件绑定
        // ================================================================

        document.querySelectorAll('.catalog-card').forEach(card => {
            card.addEventListener('click', function() {
                const target = this.dataset.target;
                if (target === 'quanzhen') {
                    showSpellList(dataQuanzhen, '全真派 · 八大神咒', '全真道日常持诵版本 · 含金光长短二咒');
                } else if (target === 'zhengyi') {
                    showSpellList(dataZhengyi, '正一派 · 八大神咒', '正一道常用版本 · 含金光长短二咒');
                } else if (target === 'huangting') {
                    showChapterView(huangtingData, '📜 黄庭经', '黄庭内景经 · 三十六章', 'ht');
                } else if (target === 'wudou') {
                    showChapterView(wudouData, '⭐ 五斗经', '北斗 · 南斗 · 东斗 · 西斗 · 中斗', 'wd');
                } else if (target === 'qingjing') {
                    showQingjing();
                }
            });
        });

        backBtn.addEventListener('click', showHome);

        // 默认首页
        showHome();

        console.log('✅ 已加载：朗读引擎 + 五部经典');
    </script>

</body>
</html>
