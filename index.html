<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>道家经典 · 八大神咒 · 黄庭 · 清静</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Serif SC", serif;
            background: #f5efe8;
            color: #3e2e1f;
            min-height: 100vh;
            padding: 16px 12px 40px;
        }
        .app-container {
            max-width: 640px;
            margin: 0 auto;
            background: rgba(255, 252, 245, 0.92);
            backdrop-filter: blur(2px);
            border-radius: 32px 32px 24px 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.07), 0 0 0 1px rgba(200, 175, 150, 0.2);
            padding: 20px 18px 32px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e2d5c8;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 500;
            letter-spacing: 3px;
            color: #4a3724;
            background: linear-gradient(135deg, #5a3f2b, #3e2a1b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .back-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #6b4f38;
            padding: 0 8px;
            transition: 0.2s;
            display: none;
        }
        .back-btn.visible {
            display: block;
        }
        .back-btn:hover {
            transform: scale(1.1);
        }
        .view {
            display: block;
        }
        .view.hidden {
            display: none;
        }

        /* ===== 首页目录 ===== */
        .catalog-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 4px;
        }
        .catalog-card {
            background: #fcf8f2;
            border-radius: 20px;
            padding: 18px 18px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #e6dad0;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }
        .catalog-card:active {
            transform: scale(0.97);
            background: #f5ede4;
        }
        .catalog-card .tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 500;
            background: #dacfc4;
            color: #3e2e1f;
            padding: 2px 14px;
            border-radius: 40px;
            letter-spacing: 1.5px;
            margin-bottom: 4px;
        }
        .catalog-card h2 {
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 2px;
            color: #2d1f14;
        }
        .catalog-card p {
            font-size: 13px;
            color: #6b5a4a;
            line-height: 1.4;
        }
        .catalog-card .arrow {
            position: absolute;
            right: 18px;
            bottom: 14px;
            font-size: 22px;
            color: #b8a18c;
            opacity: 0.5;
        }
        .card-shenzhou .tag { background: #c7b7a3; }
        .card-huangting .tag { background: #c9b9a2; }
        .card-qingjing .tag { background: #d5c8ba; }

        /* ===== 二级列表 ===== */
        .sub-title {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 2px;
            color: #3e2a1b;
        }
        .sub-desc {
            font-size: 13px;
            color: #7a6856;
            margin-bottom: 12px;
            border-left: 3px solid #dacfc4;
            padding-left: 14px;
        }
        .spell-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .spell-item {
            background: #fcf8f2;
            border-radius: 18px;
            padding: 16px 16px 12px;
            border: 1px solid #ebe0d5;
        }
        .spell-name {
            font-size: 19px;
            font-weight: 550;
            color: #3e2a1b;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .spell-name .badge {
            font-size: 11px;
            font-weight: 400;
            background: #ded3c8;
            color: #3e2a1b;
            padding: 0 12px;
            border-radius: 30px;
            letter-spacing: 0.5px;
        }
        .spell-name .badge.long { background: #c9b9a8; }
        .spell-name .badge.short { background: #dacfc4; }
        .spell-body {
            margin-top: 8px;
        }
        .verse-line {
            font-size: 18px;
            line-height: 2.0;
            letter-spacing: 0.04em;
            font-weight: 450;
            color: #2c1f14;
            padding: 1px 0;
            font-family: "Noto Serif SC", "华文楷体", "KaiTi", "STKaiti", "楷体", serif;
        }
        .spell-divider {
            margin: 10px 0 6px;
            border: 0;
            height: 1px;
            background: linear-gradient(to right, #e6dacd, transparent);
        }

        /* ===== 通用章节样式（黄庭经） ===== */
        .chapter-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 8px;
            margin-bottom: 18px;
            padding: 12px 10px;
            background: #f5ede4;
            border-radius: 16px;
            max-height: 200px;
            overflow-y: auto;
        }
        .chapter-nav a {
            font-size: 13px;
            color: #4a3724;
            text-decoration: none;
            background: #fffcf5;
            padding: 2px 12px;
            border-radius: 30px;
            border: 1px solid #dacfc4;
            transition: 0.15s;
            font-family: inherit;
        }
        .chapter-nav a:active {
            background: #dacfc4;
        }
        .chapter-block {
            margin-bottom: 24px;
        }
        .chapter-title {
            font-size: 18px;
            font-weight: 550;
            color: #3e2a1b;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px dashed #ddd0c4;
        }
        .chapter-body .verse-line {
            font-size: 17px;
            line-height: 2.1;
        }
        .chapter-body .verse-line:first-child {
            margin-top: 4px;
        }

        /* ===== 清静经 ===== */
        .qingjing-body .verse-line {
            font-size: 18px;
            line-height: 2.2;
            text-align: left;
        }

        .footer-note {
            margin-top: 28px;
            text-align: center;
            font-size: 12px;
            color: #b3a08e;
            letter-spacing: 1px;
            border-top: 1px solid #ece1d7;
            padding-top: 16px;
        }
        .fade-in {
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 480px) {
            .app-container { padding: 14px 10px 24px; }
            .header h1 { font-size: 19px; letter-spacing: 2px; }
            .verse-line { font-size: 16px; line-height: 1.9; }
            .catalog-card h2 { font-size: 20px; }
            .chapter-body .verse-line { font-size: 15px; }
            .chapter-nav a { font-size: 12px; padding: 1px 10px; }
            .qingjing-body .verse-line { font-size: 16px; }
        }

        /* 生僻字专用字体 */

            font-family: 'RareChars';
            src: url(data:font/truetype;charset=utf-8;base64,AAEAAAAOAIAAAwBgRkZUTYAAAOwAAAAHAAAAHAAAABRTVNDTAAAA+wAAABSAAAAVABUA1RHREVGAAAQQAAAABUAAAAVABMAFEdQT1MAAAgAAAABlAAAAZQZuBUjR1NVQgAAA6AAAAAsAAAALACgAAAAAAAAOE9TLzIAAAGQAAAAUAAAAGBpgX1EY21hcAAAAcAAAABsAAAAbBPOFkpnYXNwAAAAQAAAABAAAAAQABEAA2dseWYAAANQAAAAaAAAAGgEZgU0aGVhZAAAAVgAAAA0AAAANhC0HQpoZWlyAAABjAAAABQAAAAUA4gAEmhteHgAAAHgAAAAIAAAACADPAAKbG9jYQAAAfAAAAAWAAAAFgAMAAxtYXhwAAABcAAAABgAAAAgACAAEm5hbWUAAAXYAAAB3AAAAeQfHBRTcG9zdAAAB7QAAABgAAAAYAGnAhYAAAAAAQAAAAEAAAxls/ItXw889QgAA+gAAAAA3lIYFgAAAADeVk1Y//UAAAO0BF8AAAAIAAIAAAAAAAB4AAMAAAAAAAIAAAAUAAAAAwAAAABABQAAAAAAAHicY2BmWc84gYGVgYGpgimOgYHhC8MczG7AqKGwgpGFGQoY1v5gYGja9IuBgY05joGhwUEByXG2A5jy+Q8zK/+hD/BzMY7IOLAwMTACAH79Dc0AAHicY2BgYGQAgjO2Bk+G1X9zA9gAACdcB6EAAHgBnZRra9NQHIZPQm3dJl1DtmuTpS72ytpNSrcyCiqbJY7uC0OEgT+Ck1HKPvjZKZtKtGk2kAKiIijTSX0BxX9i/+GDgoKCAwFfmjzvg8I9XhR1HmB43+d535xM9hwFoCJxM+HGfw0CqAijD8UozmN1vMG9Vw3qus5PXEAgkSzO6wZQmMZr+qKxrSfy3Axr0QJtIVGLGx72prTutNZtL3Q9iFJNXdR7QmTTPmh30uJ2kYtxLW/X00bPzibRUj7P2iKRRHI2tf33yHcQNahkQx2/9KS+P7ad0x84TWqH2+XCDyrsRutVnE6Tj3ST7UUKvOWTpmKb5D3Pec62MqtcFqWqerx1T61fsvt5N7qLDzS3SdH7xPp1O8BzW9sOsHjB+yEf8iSf8hV/fuZ35rLM3zq/8Qf/808GC6k3lHpDqTfM++9QunpZzrMeRMTQvRzARZyk2Q8X7GVx2McK3KafvRyhT40tWV+i+Z7+bVQcKqPkyCzNZY6mGueXnOn7vOxlWV/LWpbmbMl6B9N9TLd5zprCnr/Pu+9zGd/09B/xIf9grsifMhOLGB6KsbZtFmXe3JbVTKS3q7+pG2nqojsibdl2Rn6Xsc2dWQmDpg3aHTfej5Q+dcK/FXG2e6rCeC28eP9/9xw1TZwFOSLzTQPNHd+lpW2tOJRGJ3vI+a24pBfyJJW3mSP7zJ4P+ZzP+JzP+ZZfOM9vLLLMH/zGZQAAAHicY2BkYGBk/Mv8h4GZ/7f/9/9FDPcZGKACCyMbAAWdBwkAeJxjYGRgYABiPvXrP/nNNwZ5JgYGBgYWTqfX5s3///+f/1X/QzBrgFkAABTjDNgAAAB4nGNgZG5iWMDAAAIgBwITBAAAhGgBWwB4nGNgYGJgYGJiYwDCAjBgYGMG+RkYIJKBkQEiGDKxMHycyABxGUD8n4WkHTOBTQAAL6IM9QAAeJxjYGBgYmBgZGBgYQvzMIMoJgZGF1iAiwEKl2FgYADScUys0v//D6Q7MDp4Obo5MTgx+jP6MhxDm9rC1pTCIIjCGhkCwdlXIGucGZWgJmsBZK1xZ1YCoWxGZoAABigAACM0+wAAeJxjYGRgYHQZxsDIwMDAwMAAsgYGOgYQBQxMgHkAgKkACwAAeJxjYGRgYOBlUGZgYmAB8hkg/g9hAEscw/wGABFVBcQAAHicY2BgYGQAgjO2Bk+G1X9zA9gAACdcB6EAAAB4nJz9B3Qdx3Ug <body>

    <div class="app-container" id="app">

        <div class="header">
            <h1 id="mainTitle">☯ 道家经典</h1>
            <button class="back-btn" id="backBtn" aria-label="返回">←</button>
        </div>

        <!-- ===== 首页 ===== -->
        <div id="homeView" class="view">
            <div style="margin-bottom:14px; font-size:13px; color:#6b5a4a; padding-left:2px;">
                <span style="background:#e6dacd; padding:2px 12px; border-radius:40px;">三部经典</span>
                <span style="margin-left:10px;">📖 点选进入</span>
            </div>
            <div class="catalog-grid">
                <div class="catalog-card card-shenzhou" data-target="shenzhou">
                    <span class="tag">全真</span>
                    <h2>☯ 八大神咒</h2>
                    <p>全真道日常持诵 · 含金光长短二咒</p>
                    <span class="arrow">→</span>
                </div>
                <div class="catalog-card card-huangting" data-target="huangting">
                    <span class="tag">上清经</span>
                    <h2>📜 黄庭经</h2>
                    <p>黄庭内景经 · 三十六章</p>
                    <span class="arrow">→</span>
                </div>
                <div class="catalog-card card-qingjing" data-target="qingjing">
                    <span class="tag">太上老君</span>
                    <h2>🌿 清静经</h2>
                    <p>太上老君说常清静经 · 全文</p>
                    <span class="arrow">→</span>
                </div>
            </div>
            <div class="footer-note">— 经文原文 · 无释义 —</div>
        </div>

        <!-- ===== 八大神咒视图 ===== -->
        <div id="listView" class="view hidden">
            <div id="listHeader">
                <div class="sub-title" id="listTitle">八大神咒</div>
                <div class="sub-desc" id="listDesc"></div>
            </div>
            <div id="spellListContainer"></div>
            <div class="footer-note">— 经文原文 —</div>
        </div>

        <!-- ===== 黄庭经视图 ===== -->
        <div id="chapterView" class="view hidden">
            <div class="sub-title" id="chapterViewTitle">📜 黄庭经</div>
            <div class="sub-desc" id="chapterViewDesc">黄庭内景经 · 三十六章</div>
            <div class="chapter-nav" id="chapterNav"></div>
            <div id="chapterBody"></div>
            <div class="footer-note">— 经文原文 —</div>
        </div>

        <!-- ===== 清静经视图 ===== -->
        <div id="qingjingView" class="view hidden">
            <div class="sub-title">🌿 太上老君说常清静经</div>
            <div class="sub-desc" style="border-left-color:#b5aa95;">常清静 · 入道之门</div>
            <div class="qingjing-body" id="qingjingBody"></div>
            <div class="footer-note">— 经文原文 —</div>
        </div>

    </div>

    <script>
        // ================================================================
        //  一、八大神咒（全真派）
        // ================================================================

        function v(text) { return { text }; }

        const shenzhouData = [{
            name: '净心神咒',
            verses: [v('太上台星，应变无停。'), v('驱邪缚魅，保命护身。'), v('智慧明净，心神安宁。'), v('三魂永久，魄无丧倾。')]
        }, {
            name: '净口神咒',
            verses: [v('丹朱口神，吐秽除氛。'), v('舌神正伦，通命养神。'), v('罗千齿神，却邪卫真。'), v('喉神虎贲，气神引津。'),
                v('心神丹元，令我通真。'), v('思神炼液，道炁常存。')
            ]
        }, {
            name: '净身神咒',
            verses: [v('灵宝天尊，安慰身形。'), v('弟子魂魄，五藏玄冥。'), v('青龙白虎，队仗纷纭。'), v('朱雀玄武，侍卫我身。')]
        }, {
            name: '安土地神咒',
            verses: [v('元始安镇，普告万灵。'), v('岳渎真官，土地祇灵。'), v('左社右稷，不得妄惊。'), v('回向正道，内外澄清。'),
                v('各安方位，备守坛庭。'), v('太上有命，搜捕邪精。'), v('护法神王，保卫诵经。'), v('皈依大道，元亨利贞。')
            ]
        }, {
            name: '净天地神咒',
            verses: [v('天地自然，秽气分散。'), v('洞中玄虚，晃朗太元。'), v('八方威神，使我自然。'), v('灵宝符命，普告九天。'),
                v('乾罗答那，洞罡太玄。'), v('斩妖缚邪，度人万千。'), v('中山神咒，元始玉文。'), v('持诵一遍，却鬼延年。'),
                v('按行五岳，八海知闻。'), v('魔王束手，侍卫我轩。'), v('凶秽消散，道炁常存。')
            ]
        }, {
            name: '金光神咒',
            badge: '长版',
            verses: [v('天地玄宗，万炁本根。'), v('广修万劫，证吾神通。'), v('三界内外，惟道独尊。'), v('体有金光，覆映吾身。'),
                v('视之不见，听之不闻。'), v('包罗天地，养育群生。'), v('受持万遍，身有光明。'), v('三界侍卫，五帝司迎。'),
                v('万神朝礼，役使雷霆。'), v('鬼妖丧胆，精怪亡形。'), v('内有霹雳，雷神隐名。'), v('洞慧交彻，五炁腾腾。'),
                v('金光速现，覆护真人。')
            ]
        }, {
            name: '金光神咒',
            badge: '短版',
            verses: [v('天地玄宗，万炁本根。'), v('广修万劫，证吾神通。'), v('三界内外，惟道独尊。'), v('体有金光，覆映吾身。'),
                v('视之不见，听之不闻。'), v('包罗天地，养育群生。'), v('受持万遍，身有光明。'), v('三界侍卫，五帝司迎。'),
                v('万神朝礼，役使雷霆。'), v('鬼妖丧胆，精怪亡形。'), v('金光速现，覆护真人。')
            ]
        }, {
            name: '祝香神咒',
            verses: [v('道由心学，心假香传。'), v('香爇玉炉，心存帝前。'), v('真灵下盼，仙旆临轩。'), v('令臣关告，迳达九天。')]
        }, {
            name: '玄蕴咒',
            verses: [v('云篆太虚，浩劫之初。'), v('乍遐乍迩，或沉或浮。'), v('五方徘徊，一丈之余。'), v('天真皇人，按笔乃书。'),
                v('以演洞章，次书灵符。'), v('元始下降，真文诞敷。'), v('昭昭其有，冥冥其无。'), v('沉疴能自痊，尘劳溺可扶。'),
                v('幽冥将有赖，由是升仙都。')
            ]
        }];
                // ================================================================
        //  二、黄庭经（黄庭内景经 · 三十六章）
        //  依据：《正统道藏》洞玄部本文类
        //  逐字核对，确保无误
        // ================================================================

        const huangtingData = [{
            chapter: 1,
            title: '上清章第一',
            lines: [
                '上清紫霞虚皇前，太上大道玉晨君。',
                '闲居蕊珠作七言，散化五形变万神。',
                '是为黄庭曰内篇，琴心三叠舞胎仙。',
                '九气映明出霄间，神盖童子生紫烟。',
                '是曰玉书可精研，咏之万过升三天。',
                '千灾以消百病痊，不惮虎狼之凶残，亦以却老年永延。'
            ]
        }, {
            chapter: 2,
            title: '上有章第二',
            lines: [

        const chapterNav = document.getElementById('chapterNav');
        const chapterBody = document.getElementById('chapterBody');
        const qingjingBody = document.getElementById('qingjingBody');

        let currentView = 'home';

        function showHome() {
            homeView.classList.remove('hidden');
            listView.classList.add('hidden');
            chapterView.classList.add('hidden');
            qingjingView.classList.add('hidden');
            backBtn.classList.remove('visible');
            mainTitle.textContent = '☯ 道家经典';
            currentView = 'home';
        }

        function showShenzhou() {
            listView.classList.remove('hidden');
            homeView.classList.add('hidden');
            chapterView.classList.add('hidden');
            qingjingView.classList.add('hidden');
            backBtn.classList.add('visible');
            mainTitle.textContent = '☯ 八大神咒';
            currentView = 'shenzhou';

            listTitle.textContent = '八大神咒';
            listDesc.textContent = '全真道日常持诵版本 · 含金光长短二咒';

            spellListContainer.innerHTML = '';
            shenzhouData.forEach(item => {
                const div = document.createElement('div');
                div.className = 'spell-item fade-in';
                const nameDiv = document.createElement('div');
                nameDiv.className = 'spell-name';
                const nameSpan = document.createElement('span');
                nameSpan.textContent = item.name;
                nameDiv.appendChild(nameSpan);
                if (item.badge) {
                    const badge = document.createElement('span');
                    badge.className = 'badge';
                    if (item.badge === '长版') badge.classList.add('long');
                    else if (item.badge === '短版') badge.classList.add('short');
                    badge.textContent = item.badge;
                    nameDiv.appendChild(badge);
                }
                div.appendChild(nameDiv);
                const bodyDiv = document.createElement('div');
                bodyDiv.className = 'spell-body';
                item.verses.forEach((verse) => {
                    const p = document.createElement('div');
                    p.className = 'verse-line';
                    p.textContent = verse.text;
                    bodyDiv.appendChild(p);
                });
                div.appendChild(bodyDiv);
                spellListContainer.appendChild(div);
            });
        }

        function showHuangting() {
            chapterView.classList.remove('hidden');
            homeView.classList.add('hidden');
            listView.classList.add('hidden');
            qingjingView.classList.add('hidden');
            backBtn.classList.add('visible');
            mainTitle.textContent = '📜 黄庭经';
            currentView = 'huangting';

            chapterViewTitle.textContent = '📜 黄庭经';
            chapterViewDesc.textContent = '黄庭内景经 · 三十六章';

            chapterNav.innerHTML = '';
            huangtingData.forEach(ch => {
                const a = document.createElement('a');
                a.href = `#ht-${ch.chapter}`;
                a.textContent = ch.chapter;
                chapterNav.appendChild(a);
            });

            chapterBody.innerHTML = '';
            huangtingData.forEach(ch => {
                const section = document.createElement('div');
                section.className = 'chapter-block';
                section.id = `ht-${ch.chapter}`;

                const titleDiv = document.createElement('div');
                titleDiv.className = 'chapter-title';
                titleDiv.textContent = `${ch.chapter}. ${ch.title}`;
                section.appendChild(titleDiv);

                const bodyDiv = document.createElement('div');
                bodyDiv.className = 'chapter-body';
                ch.lines.forEach(line => {
                    const p = document.createElement('div');
                    p.className = 'verse-line';
                    p.textContent = line;
                    bodyDiv.appendChild(p);
                });
                section.appendChild(bodyDiv);
                chapterBody.appendChild(section);
            });
        }

        function showQingjing() {
            qingjingView.classList.remove('hidden');
            homeView.classList.add('hidden');
            listView.classList.add('hidden');
            chapterView.classList.add('hidden');
            backBtn.classList.add('visible');
            mainTitle.textContent = '🌿 清静经';
            currentView = 'qingjing';

            qingjingBody.innerHTML = '';
            qingjingLines.forEach(line => {
                const p = document.createElement('div');
                p.className = 'verse-line';
                p.textContent = line;
                qingjingBody.appendChild(p);
            });
        }

        // ================================================================
        //  事件绑定
        // ================================================================

        document.querySelectorAll('.catalog-card').forEach(card => {
            card.addEventListener('click', function() {
                const target = this.dataset.target;
                if (target === 'shenzhou') {
                    showShenzhou();
                } else if (target === 'huangting') {
                    showHuangting();
                } else if (target === 'qingjing') {
                    showQingjing();
                }
            });
        });

        backBtn.addEventListener('click', showHome);

        // 默认显示首页
        showHome();

        console.log('✅ 道家经典加载完成：八大神咒 + 黄庭经 + 清静经');
    </script>

</body>
</html>
